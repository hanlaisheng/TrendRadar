preset: custom

custom:
  name: "自定义"
  description: "每天06:00早报 + 18:00晚报"
  default:
    collect: true
    analyze: false
    ai_mode: "current"
    push: false
    report_mode: "current"
    once:
      analyze: true
      push: true
  periods:
    morning_push:
      name: "早间推送"
      start: "06:00"
      end: "08:00"
      analyze: true
      ai_mode: "current"
      push: true
      report_mode: "current"
      once:
        analyze: true
        push: true
    evening_push:
      name: "晚间推送"
      start: "18:00"
      end: "20:00"
      analyze: true
      ai_mode: "daily"
      push: true
      report_mode: "daily"
      once:
        analyze: true
        push: true
  day_plans:
    every_day:
      periods: ["morning_push", "evening_push"]
  week_map:
    1: "every_day"
    2: "every_day"
    3: "every_day"
    4: "every_day"
    5: "every_day"
    6: "every_day"
    7: "every_day"

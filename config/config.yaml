app:
  timezone: Asia/Shanghai
  show_version_update: true
schedule:
  enabled: false
  preset: custom
platforms:
  enabled: true
  api_url: ''
  sources:
  - id: toutiao
    name: 今日头条
    expected_domain: toutiao.com
    enabled: false
  - id: baidu
    name: 百度热搜
    expected_domain: baidu.com
    enabled: false
  - id: wallstreetcn-hot
    name: bilibili 热搜
    expected_domain: bilibili.com
    enabled: false
  - id: cls-hot
    name: 凤凰网
    expected_domain: ifeng.com
    enabled: false
  - id: tieba
    name: 贴吧
    expected_domain: baidu.com
    enabled: false
  - id: weibo
    name: 微博
    expected_domain: weibo.com
    enabled: false
  - id: douyin
    name: 抖音
    expected_domain: douyin.com
    enabled: false
  - id: zhihu
    name: 知乎
    expected_domain: zhihu.com
    enabled: false
  - id: xueqiu-hotstock
    name: 雪球热股
    expected_domain: xueqiu.com
    enabled: false
  - id: sspai
    name: 少数派
    expected_domain: sspai.com
    enabled: false
  - id: ithome
    name: IT之家
    expected_domain: ithome.com
    enabled: false
  - id: solidot
    name: Solidot
    expected_domain: solidot.org
    enabled: false
rss:
  enabled: true
  freshness_filter:
    enabled: true
    max_age_days: 1
  feeds:
  # ── 综合与通讯社 ─────────────────────────────────────────────
  - id: bbc-world
    name: BBC世界新闻
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  - id: nytimes-world
    name: 纽约时报
    url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
  - id: guardian-world
    name: 卫报世界新闻
    url: https://www.theguardian.com/world/rss
  - id: guardian-environment
    name: 卫报环境气候
    url: https://www.theguardian.com/environment/rss
    max_age_days: 2
  # 路透社/美联社官方 RSS 已停服，改用 Google News 站点检索作为替代通道
  - id: reuters-gn
    name: 路透社(站点检索)
    url: "https://news.google.com/rss/search?q=site:reuters.com+when:1d&hl=en-US&gl=US&ceid=US:en"
  - id: ap-gn
    name: 美联社(站点检索)
    url: "https://news.google.com/rss/search?q=site:apnews.com+when:1d&hl=en-US&gl=US&ceid=US:en"

  # ── 财经与市场 ───────────────────────────────────────────────
  - id: bloomberg-markets
    name: 彭博市场
    url: https://feeds.bloomberg.com/markets/news.rss
  - id: ft-world
    name: 金融时报FT
    url: https://www.ft.com/rss/home
  - id: cnbc-world
    name: CNBC全球财经
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100727362
  - id: wsj-markets
    name: 华尔街日报市场
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
  - id: marketwatch-top
    name: MarketWatch头条
    url: https://feeds.content.dowjones.io/public/rss/mw_topstories
  - id: marketwatch-pulse
    name: MarketWatch市场异动
    url: https://feeds.content.dowjones.io/public/rss/mw_marketpulse
    max_age_days: 2
  - id: economist-finance
    name: 经济学人·金融
    url: https://www.economist.com/finance-and-economics/rss.xml
    max_age_days: 4
  - id: economist-china
    name: 经济学人·中国
    url: https://www.economist.com/china/rss.xml
    max_age_days: 4
  - id: nytimes-economy
    name: 纽约时报经济
    url: https://rss.nytimes.com/services/xml/rss/nyt/Economy.xml

  # ── 贵金属与大宗商品 ─────────────────────────────────────────
  - id: investing-gold
    name: Investing黄金
    url: https://www.investing.com/rss/news_285.rss
  # FXStreet / Mining.com 在 GitHub Actions 出口 IP 上返回 403，改用主题检索通道
  - id: gold-gn
    name: 黄金贵金属(主题检索)
    url: "https://news.google.com/rss/search?q=(gold+OR+bullion+OR+silver+OR+XAU)+site:reuters.com+OR+site:kitco.com+when:2d&hl=en-US&gl=US&ceid=US:en"
    max_age_days: 2
  - id: metals-gn
    name: 金属矿业(主题检索)
    url: "https://news.google.com/rss/search?q=(copper+OR+lithium+OR+mining+OR+smelter)+when:2d&hl=en-US&gl=US&ceid=US:en"
    max_age_days: 2

  # ── 官方一级信源（政策/数据原文，预测基准） ───────────────────
  - id: fed-press
    name: 美联储公告
    url: https://www.federalreserve.gov/feeds/press_all.xml
    max_age_days: 7
  - id: ecb-press
    name: 欧洲央行公告
    url: https://www.ecb.europa.eu/rss/press.html
    max_age_days: 7
  - id: eia-energy
    name: 美国能源信息署
    url: https://www.eia.gov/rss/todayinenergy.xml
    max_age_days: 4

  # ── 科技与产业 ───────────────────────────────────────────────
  - id: techcrunch
    name: TechCrunch
    url: https://techcrunch.com/feed/
  - id: theverge
    name: The Verge
    url: https://www.theverge.com/rss/index.xml
  - id: arstechnica
    name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
  - id: mit-tech
    name: MIT科技评论
    url: https://www.technologyreview.com/feed/
    max_age_days: 4
  - id: hacker-news
    name: Hacker News
    url: https://hnrss.org/frontpage
  - id: solidot
    name: Solidot奇客
    url: https://www.solidot.org/index.rss
  - id: ithome-rss
    name: IT之家
    url: https://www.ithome.com/rss/
  - id: ifanr
    name: 爱范儿
    url: https://www.ifanr.com/feed
  - id: qbitai
    name: 量子位
    url: https://www.qbitai.com/feed
  - id: infoq-cn
    name: InfoQ中文
    url: https://www.infoq.cn/feed
    max_age_days: 2

  # ── 气候与能源转型 ───────────────────────────────────────────
  - id: carbon-brief
    name: Carbon Brief气候
    url: https://www.carbonbrief.org/feed/
    max_age_days: 4
  - id: climate-inside
    name: InsideClimate气候
    url: https://insideclimatenews.org/feed/
    max_age_days: 4

  # ── 加密资产 ─────────────────────────────────────────────────
  - id: coindesk
    name: CoinDesk加密货币
    url: https://www.coindesk.com/arc/outboundfeeds/rss/

  # ── 已停用 ───────────────────────────────────────────────────
  - id: ruanyifeng
    name: 阮一峰的网络日志
    url: http://www.ruanyifeng.com/blog/atom.xml
    enabled: false
report:
  mode: daily
  display_mode: keyword
  sort_by_position_first: false
  rank_threshold: 5
  max_news_per_keyword: 1
filter:
  method: keyword
  priority_sort_enabled: true
ai_filter:
  batch_size: 200
  batch_interval: 2
  min_score: 0.9
  reclassify_threshold: 0.6
  prompt_file: prompt.txt
  extract_prompt_file: extract_prompt.txt
  update_tags_prompt_file: update_tags_prompt.txt
display:
  region_order:
  - ai_analysis
  regions:
    hotlist: false
    new_items: false
    # 注意：当前上游版本把"RSS 分析"与"RSS 展示"绑在同一个开关上，
    # 这里必须为 true 才会执行 RSS 关键词匹配并把 RSS 内容交给 AI 分析。
    # 推送里不会出现 RSS 原文列表，因为 region_order 只保留了 ai_analysis。
    rss: true
    standalone: false
    ai_analysis: true
  standalone:
    platforms:
    - zhihu
    rss_feeds: []
    max_items: 5
notification:
  enabled: true
  channels:
    feishu:
      webhook_url: ''
    dingtalk:
      webhook_url: ''
    wework:
      webhook_url: ''
      msg_type: markdown
    telegram:
      bot_token: ''
      chat_id: ''
    email:
      from: ''
      password: ''
      to: ''
      smtp_server: ''
      smtp_port: ''
    ntfy:
      server_url: https://ntfy.sh
      topic: ''
      token: ''
    bark:
      url: ''
    slack:
      webhook_url: ''
    generic_webhook:
      webhook_url: ''
      payload_template: ''
storage:
  backend: auto
  formats:
    sqlite: true
    txt: false
    html: true
  local:
    data_dir: output
    retention_days: 0
  remote:
    retention_days: 0
    endpoint_url: ''
    bucket_name: ''
    access_key_id: ''
    secret_access_key: ''
    region: ''
  pull:
    enabled: false
    days: 7
ai:
  model: openai/nvidia/nemotron-3-ultra-550b-a55b
  api_key: ''
  api_base: https://integrate.api.nvidia.com/v1
  timeout: 300
  temperature: 0.7
  max_tokens: 8000
  num_retries: 2
  fallback_models:
  - openai/nvidia/nemotron-3-super-120b-a12b
ai_analysis:
  enabled: true
  language: Chinese
  prompt_file: ai_analysis_prompt.txt
  mode: follow_report
  max_news_for_analysis: 60
  include_rss: true
  include_standalone: false
  include_rank_timeline: true
  require_success_before_push: false
  ai_retry_count: 3
  ai_retry_interval: 30
ai_translation:
  enabled: true
  language: 中文
  prompt_file: ai_translation_prompt.txt
  batch_size: 100
  batch_interval: 2
  scope:
    hotlist: false
    rss: true
    standalone: true
advanced:
  debug: false
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version
  mcp_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp
  configs_version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs
  crawler:
    request_interval: 2000
    use_proxy: false
    default_proxy: http://127.0.0.1:10801
  rss:
    request_interval: 1000
    timeout: 15
    use_proxy: false
    proxy_url: ''
  weight:
    rank: 0.6
    frequency: 0.3
    hotness: 0.1
  max_accounts_per_channel: 3
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3
  feishu_message_separator: ━━━━━━━━━━━━━━━━

name: Sync Upstream

# ✅ 自动同步上游仓库更新
# ✅ 定期检查 sansan0/TrendRadar 是否有新提交
# ✅ 如果有更新，自动合并到 hanlaisheng/TrendRadar

on:
  schedule:
    # 每天 UTC 02:00 执行（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:  # 保留手动触发能力

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ github.token }}
      
      - name: Sync upstream changes
        run: |
          # 不在 -e 模式下运行，避免单个命令失败导致整个脚本退出
          set +e
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "=== TrendRadar Sync Upstream ==="
          echo "时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          
          # 添加上游仓库
          echo "[1/5] 添加上游仓库 remote..."
          git remote add upstream https://github.com/sansan0/TrendRadar.git 2>/dev/null || true
          
          # 获取上游更新
          echo "[2/5] 获取上游更新..."
          git fetch upstream
          FETCH_EXIT=$?
          if [ $FETCH_EXIT -ne 0 ]; then
            echo "❌ git fetch upstream 失败 (exit code: $FETCH_EXIT)"
            echo "UP_TO_DATE=fetch_failed" >> $GITHUB_ENV
            exit 1
          fi
          echo "✅ 上游 fetch 成功"
          
          # 检查是否有新提交
          echo "[3/5] 检查分支状态..."
          LOCAL=$(git rev-parse master 2>&1)
          UPSTREAM=$(git rev-parse upstream/master 2>&1)
          BASE=$(git merge-base master upstream/master 2>&1)
          
          echo "  Local:  $LOCAL"
          echo "  Upstream: $UPSTREAM"
          echo "  Base:  $BASE"
          echo ""
          
          if [ "$UPSTREAM" = "$BASE" ]; then
            echo "✅ 已是最新，无需更新"
            echo "UP_TO_DATE=true" >> $GITHUB_ENV
            echo ""
            echo "=== 同步完成：无需更新 ==="
          
          elif [ "$LOCAL" = "$BASE" ]; then
            echo "📥 有新更新，正在合并..."
            echo "[4/5] 执行 git merge..."
            git merge upstream/master --no-edit
            MERGE_EXIT=$?
            if [ $MERGE_EXIT -ne 0 ]; then
              echo "❌ git merge 失败 (exit code: $MERGE_EXIT)"
              echo "可能有合并冲突，需要手动处理"
              echo "UP_TO_DATE=merge_conflict" >> $GITHUB_ENV
              git merge --abort 2>/dev/null || true
              exit 1
            fi
            
            echo "[5/5] 推送到 origin/master..."
            git push origin master
            PUSH_EXIT=$?
            if [ $PUSH_EXIT -ne 0 ]; then
              echo "❌ git push 失败 (exit code: $PUSH_EXIT)"
              echo "UP_TO_DATE=push_failed" >> $GITHUB_ENV
              exit 1
            fi
            
            echo "✅ 合并成功并已推送"
            echo "UP_TO_DATE=false" >> $GITHUB_ENV
            echo ""
            echo "=== 同步完成：已合并上游更新 ==="
          
          else
            echo "⚠️ 分支已分叉（fork 有本地修改，upstream 也有新提交）"
            echo "  本地 HEAD: $LOCAL"
            echo "  上游 HEAD: $UPSTREAM"
            echo "  公共祖先: $BASE"
            echo ""
            echo "分叉是正常的（你有自定义配置），跳过自动合并"
            echo "UP_TO_DATE=diverged" >> $GITHUB_ENV
            echo ""
            echo "=== 同步完成：分支分叉，已跳过 ==="
          fi

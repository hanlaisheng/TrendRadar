name: Get Hot News

on:
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # 📅 每天推送 3 次（北京时间）早间 ~06:30 / 午间 ~12:10 / 晚间 ~18:10
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 实测到的 GitHub 真实行为（2026-11-24 ~ 11-28 共 5 天日志统计）：
    #   1) 不是「按 cron 时间点触发」。一条 */15 的行本应一天触发 96 次，
    #      实际只跑了 1~2 次；而每多一条 cron 行，一天就多一次运行。
    #      结论：一条 cron 行 ≈ 一天触发一次。
    #   2) 触发延迟 0~8 小时且随机，时刻完全不可控。请求 22:30 UTC，
    #      实测 02:58 UTC 才开跑。
    #   3) 这 5 天里没有任何一次运行被并发取消，所以问题不在 concurrency，
    #      纯粹是「触发次数太少 + 落点随机」。
    #
    # 因此策略是「多行覆盖 + 宽窗口裁决」：
    #   · 用 24 条 cron 行（每小时 :30 一条）把一天铺满，期望跑 ~20-24 次；
    #   · config/timeline.yaml 把 06:00-23:00 切成三个桶
    #     （06:00-12:00 / 12:00-18:00 / 18:00-23:00）。桶内第一个落进来的
    #     运行立即采集+分析+推送，once.push 保证每个桶当天只推 1 条；
    #   · 落在 23:00-06:00 的运行秒退，不采集、不推送，半夜绝不打扰。
    #
    # 这样「当天某桶内至少有一次运行」= 那一推必然成立。按 24 次/天、
    # 落点随机估算，单个桶完全没人落进来的概率 < 0.5%，一天三条齐全的概率
    # 约 98.7%（此前窄窗口的做法：一天只有 4~6 次触发，只要早到几分钟就
    # 整段丢弃，实测 11-25 丢早间、11-28 丢午间）。
    #
    # 仓库是 public，Actions 分钟数不计费，所以多跑几次没有成本问题。
    #
    # 想要「分钟级准点」，GitHub 自身的 cron 做不到，只能加一个外部定时器
    # 去调 workflow_dispatch，本文件不负责准点。
    #
    # 下列 24 条按 UTC 排列，右注为对应的北京时间（仅作参考，实际落点会漂移）
    - cron: "30 22 * * *"   # 06:30 CST  早间
    - cron: "30 23 * * *"   # 07:30 CST  早间
    - cron: "30 0 * * *"    # 08:30 CST  早间
    - cron: "30 1 * * *"    # 09:30 CST  早间
    - cron: "30 2 * * *"    # 10:30 CST  早间
    - cron: "30 3 * * *"    # 11:30 CST  早间
    - cron: "30 4 * * *"    # 12:30 CST  午间
    - cron: "30 5 * * *"    # 13:30 CST  午间
    - cron: "30 6 * * *"    # 14:30 CST  午间
    - cron: "30 7 * * *"    # 15:30 CST  午间
    - cron: "30 8 * * *"    # 16:30 CST  午间
    - cron: "30 9 * * *"    # 17:30 CST  午间
    - cron: "30 10 * * *"   # 18:30 CST  晚间
    - cron: "30 11 * * *"   # 19:30 CST  晚间
    - cron: "30 12 * * *"   # 20:30 CST  晚间
    - cron: "30 13 * * *"   # 21:30 CST  晚间
    - cron: "30 14 * * *"   # 22:30 CST  晚间
    - cron: "30 15 * * *"   # 23:30 CST  静默
    - cron: "30 16 * * *"   # 00:30 CST  静默
    - cron: "30 17 * * *"   # 01:30 CST  静默
    - cron: "30 18 * * *"   # 02:30 CST  静默
    - cron: "30 19 * * *"   # 03:30 CST  静默
    - cron: "30 20 * * *"   # 04:30 CST  静默
    - cron: "30 21 * * *"   # 05:30 CST  静默（延迟后极易落进早间桶起点）

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  # 不再「来新的就掐掉正在跑的」：一次推送可能要发 1~2 个批次，
  # 正发到一半被新触发取消 = 用户收到半截消息且当天该桶算作未推。
  # 改成排队：同一时间只跑一个，后来的等着，靠 timeline 的 once 去重。
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Check Expiration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="crawler.yml"
          API_URL="repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs"

          TOTAL=$(gh api "$API_URL" --jq '.total_count')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "No previous runs found, skipping expiration check"
            exit 0
          fi

          LAST_PAGE=$(( (TOTAL + 99) / 100 ))
          FIRST_RUN_DATE=$(gh api "$API_URL?per_page=100&page=$LAST_PAGE" --jq '.workflow_runs[-1].created_at')

          if [ -n "$FIRST_RUN_DATE" ]; then
            CURRENT_TIMESTAMP=$(date +%s)
            FIRST_RUN_TIMESTAMP=$(date -d "$FIRST_RUN_DATE" +%s)
            DIFF_SECONDS=$((CURRENT_TIMESTAMP - FIRST_RUN_TIMESTAMP))
            LIMIT_SECONDS=604800

            if [ $DIFF_SECONDS -gt $LIMIT_SECONDS ]; then
              echo "ℹ️ 试用期已超过7天，但已配置永久运行，无需签到续期"
              echo "ℹ️ Trial period exceeded 7 days, but perpetual mode is enabled."
              echo "✅ 继续执行推送任务"
            else
              DAYS_LEFT=$(( (LIMIT_SECONDS - DIFF_SECONDS) / 86400 ))
              echo "✅ 试用期剩余 ${DAYS_LEFT} 天，到期前请运行 'Check In' 签到续期"
              echo "✅ Trial: ${DAYS_LEFT} days left. Run 'Check In' before expiry to renew."
            fi
          fi


      # --------------------------------------------------------------------------------
      # 🚦 TRAFFIC CONTROL / 流量控制
      # --------------------------------------------------------------------------------
      # EN: Generates a random delay between 1 and 300 seconds (5 minutes).
      #     Critical for load balancing.
      #
      # CN: 生成 1 到 300 秒（5分钟）之间的随机延迟。
      #     这对负载均衡至关重要。
      # - name: Random Delay (Traffic Control)
      #   if: success()
      #   run: |
      #     echo "🎲 Traffic Control: Generating random delay..."
      #     DELAY=$(( ( RANDOM % 300 )  + 1 ))
      #     echo "⏸️  Sleeping for ${DELAY} seconds to spread the load..."
      #     sleep ${DELAY}s
      #     echo "▶️  Delay finished. Starting crawler..."

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: output
          key: trendradar-data-${{ github.run_id }}
          restore-keys: |
            trendradar-data-

      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # 通用Webhook配置
          GENERIC_WEBHOOK_URL: ${{ secrets.GENERIC_WEBHOOK_URL }}
          GENERIC_WEBHOOK_TEMPLATE: ${{ secrets.GENERIC_WEBHOOK_TEMPLATE }}
          # AI 配置（ai_analysis 和 ai_translation 共享模型配置）
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Save data cache
        if: always()
        uses: actions/cache@v4
        with:
          path: output
          key: trendradar-data-${{ github.run_id }}

      # 上传本次生成的图表版报告，便于在 Actions 页面直接查看/下载，
      # 也便于核对 AI 分析正文是否出现"暂无数据"类占位或空话。
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: output/html/latest/
          retention-days: 3
          if-no-files-found: ignore
